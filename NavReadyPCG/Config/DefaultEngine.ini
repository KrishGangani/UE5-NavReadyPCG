; P08 NavReadyPCG - engine configuration.
; The benchmark keys below restate engine defaults on purpose, so a later change can't silently cap or smooth frame times.

[/Script/EngineSettings.GameMapsSettings]
; An engine map with lights, sky and a player start. The arena itself (floor, navigation bounds, PCG cells) is built
; at runtime by UNRBenchmarkSubsystem, 1 km away from the template's own floor.
GameDefaultMap=/Engine/Maps/Templates/Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default

[/Script/Engine.Engine]
; No frame-rate smoothing or fixed frame-rate cap: frame time must reflect real work.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
; VSync off so Present never blocks the frame.
r.VSync=0

[/Script/NavigationSystem.NavigationSystemV1]
; No Detour crowd manager: this project has no crowd-following agents. With the default class, the manager looks for a
; Recast navmesh during world teardown, finds the runtime one already gone, and logs a warning on every exit.
CrowdManagerClass=

[/Script/NavigationSystem.RecastNavMesh]
; The engine default is Static (BaseEngine.ini, [/Script/NavigationSystem.NavigationData]), which never rebuilds at runtime.
; Content that PCG generates while the game runs needs Dynamic, the only mode that builds navmesh for new geometry.
; Every other navmesh setting stays at its engine default.
RuntimeGeneration=Dynamic

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
