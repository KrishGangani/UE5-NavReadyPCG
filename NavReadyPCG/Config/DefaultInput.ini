[/Script/Engine.InputSettings]
; The engine's own default is the legacy UPlayerInput (InputSettings.cpp:52). The Enhanced Input plugin, which the engine
; enables by default, casts the player's input object to UEnhancedPlayerInput and logs a warning on every map load when
; the cast fails (EnhancedInputSubsystems.cpp:79, 118). These two lines are the values Epic's 5.8 templates ship with.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
